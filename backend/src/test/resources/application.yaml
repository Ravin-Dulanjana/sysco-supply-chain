app:
  security:
    enabled: false
  jwt:
    secret: this-is-a-very-long-dev-secret-key-for-hs256-auth-token-signing
  saga:
    topic: order-saga-topic
    inventory-failure-threshold: 100
    payment-failure-trigger: FAIL_PAYMENT
  outbox:
    relay-delay-ms: 50

spring:
  application:
    name: supply-service-test
  jpa:
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always

info:
  app:
    name: Micro Supply Chain Order Processing System
    version: 1.0.0

resilience4j:
  retry:
    instances:
      kafkaPublish:
        max-attempts: 2
        wait-duration: 100ms

logging:
  level:
    com.sysco.supplyservice: INFO
    org.springframework.kafka: WARN
    org.hibernate: WARN
